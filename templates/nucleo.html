<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desempenho & Gráficos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root { 
            --bg-principal: linear-gradient(135deg, #0a0a0a 0%, #000000 100%);
            --bg-painel: rgba(20, 20, 20, 0.75); 
            --texto-puro: #ffffff; 
            --texto-base: #e0e0e0;
            --texto-mutado: #888888;
            --borda-sutil: rgba(255, 255, 255, 0.08); 
        }

        body, html { 
            height: 100%; 
            width: 100vw;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-principal); 
            color: var(--texto-base); 
            overflow: hidden; 
        }

        .btn-voltar { 
            position: absolute; 
            top: 30px; 
            left: 30px; 
            z-index: 10; 
            background: var(--bg-painel); 
            color: var(--texto-puro); 
            padding: 12px 24px; 
            text-decoration: none; 
            border-radius: 6px; 
            border: 1px solid var(--borda-sutil); 
            transition: 0.3s;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }
        .btn-voltar:hover { background: rgba(255,255,255,0.1); }

        #canvas-energia { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Esfera centralizada corretamente */
        .area-nucleo { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .area-stats { 
            width: 400px; 
            background: var(--bg-painel); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-left: 1px solid var(--borda-sutil); 
            padding: 50px 40px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            gap: 2rem; 
            box-shadow: -10px 0 30px rgba(0,0,0,0.5); 
        }

        /* Tons de cinza e prata para a esfera de energia */
        .nucleo { border-radius: 50%; transition: all 1s ease-in-out; position: relative; }
        .nivel-1 { width: 60px; height: 60px; background: #333333; box-shadow: 0 0 20px rgba(255,255,255,0.2); animation: pulse-suave 3s infinite; }
        .nivel-2 { width: 100px; height: 100px; background: #666666; box-shadow: 0 0 40px rgba(255,255,255,0.4); animation: pulse-suave 2s infinite; }
        .nivel-3 { width: 140px; height: 140px; background: #a0a0a0; box-shadow: 0 0 60px rgba(255,255,255,0.6); animation: pulse-cardiaco 1.5s infinite; }
        .nivel-4 { width: 180px; height: 180px; background: #e0e0e0; box-shadow: 0 0 80px rgba(255,255,255,0.8); animation: pulse-sol 3s infinite alternate; }
        .nivel-5 { width: 200px; height: 200px; background: #000000; border: 4px solid #ffffff; box-shadow: 0 0 100px #ffffff; animation: pulse-singularidade 4s infinite linear; }
        
        @keyframes pulse-suave { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
        @keyframes pulse-cardiaco { 0%, 30%, 100% { transform: scale(0.95); } 15% { transform: scale(1.05); } 45% { transform: scale(1.02); } }
        @keyframes pulse-sol { 0% { transform: scale(0.98); box-shadow: 0 0 60px rgba(255,255,255,0.5); } 100% { transform: scale(1.02); box-shadow: 0 0 100px rgba(255,255,255,0.9); } }
        @keyframes pulse-singularidade { 0% { transform: rotate(0deg) scale(1); box-shadow: 0 0 60px rgba(255,255,255,0.7); } 50% { transform: rotate(180deg) scale(1.05); box-shadow: 0 0 120px rgba(255,255,255,1); } 100% { transform: rotate(360deg) scale(1); box-shadow: 0 0 60px rgba(255,255,255,0.7); } }

        .titulo { font-size: 1.5rem; font-weight: 300; margin: 0; color: var(--texto-mutado); text-transform: uppercase; letter-spacing: 2px;}
        .nivel-display { font-size: 3.5rem; color: var(--texto-puro); font-weight: 800; margin-bottom: 1rem; text-shadow: 0 0 20px rgba(255,255,255,0.2);}
        
        .stat-card { background: rgba(0,0,0,0.4); border: 1px solid var(--borda-sutil); padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .stat-label { font-size: 0.9rem; color: var(--texto-mutado); text-transform: uppercase; font-weight: 600;}
        .stat-value { font-size: 1.4rem; font-weight: bold; color: var(--texto-puro); }
    </style>
</head>
<body>

    <a href="/" class="btn-voltar">Voltar ao Edital</a>
    <canvas id="canvas-energia"></canvas>

    <div class="main-container">
        <div class="area-nucleo">
            <div id="meu-nucleo" class="nucleo nivel-1"></div>
        </div>

        <div class="area-stats">
            <div>
                <h1 class="titulo">Nível Atual</h1>
                <div id="txt-nivel" class="nivel-display">Nível 1</div>
            </div>
            
            <div class="stat-card">
                <span class="stat-label">Sequência de Estudos</span>
                <span id="txt-dias-seguidos" class="stat-value">Carregando...</span>
            </div>
            
            <div class="stat-card">
                <span class="stat-label">Pontuação Total</span>
                <span id="txt-xp-total" class="stat-value">Carregando...</span>
            </div>
        </div>
    </div>

<script>
    async function carregarDadosReais() {
        try {
            const res = await fetch('/api/dados');
            const data = await res.json();
            
            // Carrega XP
            const xpReal = data.xp || 0;
            document.getElementById('txt-xp-total').innerText = xpReal;
            
            // Carrega Dias Seguidos Dinamicamente
            const diasSeguidos = data.dias_seguidos || 0;
            const textoDias = diasSeguidos === 1 ? 'Dia' : 'Dias';
            document.getElementById('txt-dias-seguidos').innerText = `${diasSeguidos} ${textoDias}`;
            
            // Calcula e ajusta o nível
            const nivel = Math.floor(Math.sqrt(xpReal / 50)) + 1; 
            document.getElementById('txt-nivel').innerText = `Nível ${nivel}`;
            
            const nucleo = document.getElementById('meu-nucleo');
            nucleo.className = 'nucleo'; 

            if (nivel < 10) nucleo.classList.add('nivel-1'); 
            else if (nivel < 30) nucleo.classList.add('nivel-2');
            else if (nivel < 60) nucleo.classList.add('nivel-3');
            else if (nivel < 100) nucleo.classList.add('nivel-4');
            else nucleo.classList.add('nivel-5');
        } catch(e) { console.error("Erro ao carregar dados:", e); }
    }

    const canvas = document.getElementById('canvas-energia');
    const ctx = canvas.getContext('2d');
    let width, height, particulas = [];

    function resize() { 
        width = canvas.width = window.innerWidth; 
        height = canvas.height = window.innerHeight; 
    }
    window.addEventListener('resize', resize);
    resize();

    class Particula {
        constructor() { 
            this.x = Math.random() * width; 
            this.y = Math.random() * height; 
            this.tamanho = Math.random() * 1.5; 
            this.vx = (Math.random() - 0.5) * 0.5; 
            this.vy = (Math.random() - 0.5) * 0.5; 
        }
        update() { 
            this.x += this.vx; 
            this.y += this.vy; 
            if(this.x < 0 || this.x > width) this.vx *= -1; 
            if(this.y < 0 || this.y > height) this.vy *= -1; 
        }
        draw() { 
            ctx.fillStyle = `rgba(255, 255, 255, 0.3)`; 
            ctx.beginPath(); 
            ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI * 2); 
            ctx.fill(); 
        }
    }
    
    for(let i = 0; i < 150; i++) particulas.push(new Particula());

    function animarCanvas() {
        ctx.clearRect(0, 0, width, height);
        particulas.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animarCanvas);
    }
    
    animarCanvas();
    carregarDadosReais();
</script>
<script>
        // === SISTEMA DE FOCO DECRESCENTE (POMODORO) ===
        let relogioIntervalo;
        let tempoTotalDefinido = parseInt(localStorage.getItem('foco_total_segundos')) || 0;
        let tempoFim = parseInt(localStorage.getItem('foco_fim_timestamp')) || 0;
        let estaRodando = localStorage.getItem('foco_rodando') === 'true';
        let idDisciplinaAtual = localStorage.getItem('foco_disciplina') || "";

        const displayRelogio = document.getElementById('relogio-global');
        const btnRelogio = document.getElementById('btn-relogio');
        const selectDisciplina = document.getElementById('select-disciplina');
        const inputMinutos = document.getElementById('input-minutos');

        async function carregarDisciplinasSelect() {
            if (!selectDisciplina) return; 
            try {
                const res = await fetch('/api/dados');
                const dadosApp = await res.json();
                const edital = dadosApp.edital || [];
                
                selectDisciplina.innerHTML = '<option value="">Selecione a Disciplina...</option>';
                edital.forEach(disc => {
                    const option = document.createElement('option');
                    option.value = disc.id || disc.nome;
                    option.innerText = disc.nome;
                    selectDisciplina.appendChild(option);
                });
                if (idDisciplinaAtual) selectDisciplina.value = idDisciplinaAtual;
            } catch (e) { console.error(e); }
        }

        function formatarTempo(seg) {
            if (seg <= 0) return "00:00:00";
            const h = String(Math.floor(seg / 3600)).padStart(2, '0');
            const m = String(Math.floor((seg % 3600) / 60)).padStart(2, '0');
            const s = String(seg % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function atualizarTelaRelogio() {
            if (!estaRodando && tempoTotalDefinido === 0) {
                if (displayRelogio) displayRelogio.innerText = "00:00:00";
                return;
            }

            let tempoRestante = Math.max(0, Math.floor((tempoFim - Date.now()) / 1000));
            
            if (displayRelogio && btnRelogio && selectDisciplina && inputMinutos) {
                displayRelogio.innerText = formatarTempo(tempoRestante);
                
                if (estaRodando) {
                    btnRelogio.innerText = "Em Foco...";
                    btnRelogio.disabled = true;
                    btnRelogio.style.opacity = "0.5";
                    selectDisciplina.disabled = true;
                    inputMinutos.disabled = true;
                } else {
                    btnRelogio.innerText = "▶ Iniciar";
                    btnRelogio.disabled = false;
                    btnRelogio.style.opacity = "1";
                    selectDisciplina.disabled = false;
                    inputMinutos.disabled = false;
                }
            }

            // Quando o tempo zera!
            if (estaRodando && tempoRestante <= 0) {
                estaRodando = false;
                clearInterval(relogioIntervalo);
                salvarFocoConcluido();
            }
        }

        function alternarRelogio() {
            if (selectDisciplina && !selectDisciplina.value) {
                alert("Selecione uma disciplina primeiro!");
                return;
            }
            let minutos = parseInt(inputMinutos.value);
            if (isNaN(minutos) || minutos <= 0) {
                alert("Digite um tempo válido em minutos.");
                return;
            }

            tempoTotalDefinido = minutos * 60;
            tempoFim = Date.now() + (tempoTotalDefinido * 1000);
            
            localStorage.setItem('foco_total_segundos', tempoTotalDefinido);
            localStorage.setItem('foco_fim_timestamp', tempoFim);
            localStorage.setItem('foco_rodando', 'true');
            if (selectDisciplina) localStorage.setItem('foco_disciplina', selectDisciplina.value);
            
            estaRodando = true;
            relogioIntervalo = setInterval(atualizarTelaRelogio, 1000);
            atualizarTelaRelogio();
        }

        function cancelarFoco() {
            if (!estaRodando) return;
            if(confirm("Deseja realmente cancelar este foco? O tempo não será salvo.")) {
                limparFocoLocal();
            }
        }

        function limparFocoLocal() {
            estaRodando = false;
            clearInterval(relogioIntervalo);
            localStorage.removeItem('foco_total_segundos');
            localStorage.removeItem('foco_fim_timestamp');
            localStorage.removeItem('foco_rodando');
            localStorage.removeItem('foco_disciplina');
            tempoTotalDefinido = 0;
            if(btnRelogio) {
                btnRelogio.innerText = "▶ Iniciar";
                btnRelogio.disabled = false;
                btnRelogio.style.opacity = "1";
            }
            if(selectDisciplina) selectDisciplina.disabled = false;
            if(inputMinutos) inputMinutos.disabled = false;
            atualizarTelaRelogio();
        }

        async function salvarFocoConcluido() {
            alert("🎯 Parabéns! Bloco de foco concluído. Salvando dados...");
            
            try {
                const res = await fetch('/api/dados');
                let dados = await res.json();

                // Soma o tempo e XP
                dados.tempo_total = (dados.tempo_total || 0) + tempoTotalDefinido;
                dados.xp = (dados.xp || 0) + Math.floor(tempoTotalDefinido / 60);
                
                // Lógica de Ofensiva (Dias Seguidos)
                const hoje = new Date().toLocaleDateString('pt-BR');
                if (dados.ultimo_acesso !== hoje) {
                    dados.dias_seguidos = (dados.dias_seguidos || 0) + 1;
                    dados.ultimo_acesso = hoje;
                }

                await fetch('/api/dados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                limparFocoLocal();
                window.location.reload(); // Recarrega para atualizar a tela inicial
            } catch (e) {
                console.error("Erro ao salvar:", e);
                alert("Erro ao salvar o progresso.");
            }
        }

        // INICIALIZAÇÃO
        carregarDisciplinasSelect();
        if (estaRodando) relogioIntervalo = setInterval(atualizarTelaRelogio, 1000);
        atualizarTelaRelogio();
    </script>

</body>
</html>
