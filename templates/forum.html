{% extends "base.html" %}

{% block titulo %}Repositório & Fórum{% endblock %}

{% block estilos %}
<style>
    /* Estilos específicos da tela de Fórum/Repositório */
    .caixa-postagem {
        background: var(--bg-card);
        border: 1px solid var(--borda-sutil);
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 40px;
    }

    textarea {
        width: 100%;
        height: 100px;
        background: rgba(0,0,0,0.5);
        border: 1px solid var(--borda-sutil);
        color: var(--texto-puro);
        padding: 15px;
        border-radius: 8px;
        resize: vertical;
        outline: none;
        font-family: inherit;
        margin-bottom: 15px;
        font-size: 1rem;
    }
    textarea:focus { border-color: var(--borda-hover); }

    .controles-postagem {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    .input-arquivo-custom {
        color: var(--texto-base);
        font-size: 0.9rem;
    }
    .input-arquivo-custom::file-selector-button {
        background: var(--btn-secundario-bg);
        color: var(--texto-puro);
        border: 1px solid var(--borda-sutil);
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 10px;
        transition: 0.3s;
    }
    .input-arquivo-custom::file-selector-button:hover { 
        background: #3a3a3a; 
        border-color: var(--borda-hover); 
    }

    button {
        background: var(--btn-primario-bg);
        color: var(--btn-primario-texto);
        padding: 10px 24px;
        border-radius: 6px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
    }
    button:hover { 
        transform: translateY(-2px); 
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1); 
    }

    .post-card {
        background: rgba(10, 10, 10, 0.5);
        border: 1px solid var(--borda-sutil);
        border-radius: 8px;
        padding: 25px;
        margin-bottom: 15px;
    }
    
    .post-header { 
        display: flex; 
        justify-content: space-between; 
        margin-bottom: 15px; 
        color: var(--texto-mutado); 
        font-size: 0.85rem; 
        border-bottom: 1px solid var(--borda-sutil); 
        padding-bottom: 10px;
    }
    
    .post-autor { font-weight: bold; color: var(--texto-puro); }
    .post-conteudo { line-height: 1.6; white-space: pre-wrap; margin-bottom: 15px; }
    
    .anexo-box {
        display: inline-flex;
        align-items: center;
        background: rgba(255,255,255,0.05);
        padding: 10px 15px;
        border-radius: 6px;
        border: 1px dashed var(--borda-sutil);
        color: #82b1ff;
        text-decoration: none;
        font-size: 0.9rem;
        transition: 0.3s;
    }
    .anexo-box:hover { 
        background: rgba(255,255,255,0.1); 
        border-color: #82b1ff; 
    }
</style>
{% endblock %}

{% block conteudo %}
<div style="max-width: 900px; margin: 0 auto; width: 100%;">
    <h1>Repositório de Estudos</h1>
    
    <div class="caixa-postagem">
        <textarea id="texto-post" placeholder="Faça uma anotação, salve uma questão ou descreva o arquivo anexado..."></textarea>
        
        <div class="controles-postagem">
            <input type="file" id="arquivo-post" class="input-arquivo-custom" accept=".pdf, image/png, image/jpeg, .doc, .docx">
            <button id="btn-publicar" onclick="enviarPost()">Salvar no Repositório</button>
        </div>
    </div>

    <div id="feed-forum"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let dadosApp = {};

    window.onload = async () => {
        await carregarDadosBanco();
        renderizarPosts();
    };

    async function carregarDadosBanco() {
        try {
            const res = await fetch('/api/dados');
            dadosApp = await res.json();
            
            const xp = dadosApp.xp || 0;
            const elemXp = document.getElementById('xp-display');
            const elemNivel = document.getElementById('nivel-display');
            
            if (elemXp) elemXp.innerText = xp;
            if (elemNivel) elemNivel.innerText = `Nível ${Math.floor(Math.sqrt(xp / 50)) + 1}`;
        } catch (erro) {
            console.error("Erro ao carregar dados:", erro);
        }
    }

    async function enviarPost() {
        const texto = document.getElementById('texto-post').value.trim();
        const arquivoInput = document.getElementById('arquivo-post');
        
        if (!texto && arquivoInput.files.length === 0) {
            alert("Digite uma descrição ou escolha um arquivo para salvar!");
            return;
        }

        const btn = document.getElementById('btn-publicar');
        btn.innerText = "Salvando...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append('texto', texto);
        formData.append('data', new Date().toLocaleDateString('pt-BR'));
        
        if (arquivoInput.files.length > 0) {
            formData.append('arquivo', arquivoInput.files[0]);
        }

        try {
            await fetch('/api/forum', {
                method: 'POST',
                body: formData
            });

            document.getElementById('texto-post').value = '';
            arquivoInput.value = '';
            
            await carregarDadosBanco();
            renderizarPosts();

        } catch (erro) {
            alert("Erro ao enviar para o repositório.");
            console.error(erro);
        } finally {
            btn.innerText = "Salvar no Repositório";
            btn.disabled = false;
        }
    }

    function renderizarPosts() {
        const feed = document.getElementById('feed-forum');
        feed.innerHTML = '';

        const forum = dadosApp.forum || [];

        if (forum.length === 0) {
            feed.innerHTML = `
                <div class="post-card" style="text-align: center; color: var(--texto-mutado);">
                    Seu repositório está vazio. Salve seus primeiros PDFs e anotações acima!
                </div>
            `;
            return;
        }

        forum.forEach(post => {
            let htmlAnexo = '';
            
            if (post.arquivo) {
                htmlAnexo = `
                    <div style="margin-top: 15px;">
                        <a href="/uploads/${post.arquivo}" target="_blank" class="anexo-box">
                            📎 ${post.arquivo}
                        </a>
                    </div>
                `;
            }

            feed.insertAdjacentHTML('beforeend', `
                <div class="post-card">
                    <div class="post-header">
                        <span class="post-autor">Eu</span>
                        <span>${post.data}</span>
                    </div>
                    <div class="post-conteudo">${post.texto || '<em>Sem descrição.</em>'}</div>
                    ${htmlAnexo}
                </div>
            `);
        });
    }
</script>
{% endblock %}
