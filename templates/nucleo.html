<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Núcleo de Energia - Desempenho</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root { 
            --bg-principal: #000000;
            --bg-painel: rgba(18, 18, 18, 0.75); 
            --texto-puro: #ffffff; 
            --texto-base: #e0e0e0;
            --texto-mutado: #888888;
            --borda-sutil: rgba(255, 255, 255, 0.1); 
            --borda-hover: rgba(255, 255, 255, 0.25);
        }

        body, html { 
            height: 100%; 
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-principal); 
            color: var(--texto-base); 
            overflow: hidden; 
        }

        .btn-voltar { 
            position: absolute; 
            top: 25px; 
            left: 25px; 
            z-index: 10; 
            background: var(--bg-painel); 
            color: var(--texto-puro); 
            padding: 12px 22px; 
            text-decoration: none; 
            border-radius: 8px; 
            border: 1px solid var(--borda-sutil); 
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-voltar:hover { 
            background: rgba(255, 255, 255, 0.12); 
            border-color: var(--borda-hover);
            transform: translateY(-1px);
        }

        #canvas-energia { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        @media (max-width: 850px) {
            .main-container {
                flex-direction: column;
            }
        }

        /* Esfera Central */
        .area-nucleo { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative;
        }

        .area-stats { 
            width: 380px; 
            background: var(--bg-painel); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--borda-sutil); 
            padding: 40px 35px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            gap: 1.8rem; 
            box-shadow: -10px 0 40px rgba(0,0,0,0.8); 
        }

        @media (max-width: 850px) {
            .area-stats {
                width: 100%;
                height: 40%;
                border-left: none;
                border-top: 1px solid var(--borda-sutil);
                padding: 25px;
            }
        }

        /* Estágios da Esfera de Energia */
        .nucleo { 
            border-radius: 50%; 
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; 
        }

        .nivel-1 { width: 70px; height: 70px; background: #333333; box-shadow: 0 0 30px rgba(255,255,255,0.15); animation: pulse-suave 3s infinite ease-in-out; }
        .nivel-2 { width: 110px; height: 110px; background: #555555; box-shadow: 0 0 50px rgba(255,255,255,0.35); animation: pulse-suave 2.2s infinite ease-in-out; }
        .nivel-3 { width: 150px; height: 150px; background: #888888; box-shadow: 0 0 70px rgba(255,255,255,0.55); animation: pulse-cardiaco 1.6s infinite ease-in-out; }
        .nivel-4 { width: 190px; height: 190px; background: #cccccc; box-shadow: 0 0 90px rgba(255,255,255,0.8); animation: pulse-sol 3s infinite alternate ease-in-out; }
        .nivel-5 { width: 220px; height: 220px; background: #000000; border: 3px solid #ffffff; box-shadow: 0 0 110px #ffffff; animation: pulse-singularidade 4s infinite linear; }
        
        @keyframes pulse-suave { 
            0%, 100% { transform: scale(0.96); opacity: 0.85; } 
            50% { transform: scale(1.04); opacity: 1; } 
        }
        @keyframes pulse-cardiaco { 
            0%, 30%, 100% { transform: scale(0.95); } 
            15% { transform: scale(1.05); } 
            45% { transform: scale(1.02); } 
        }
        @keyframes pulse-sol { 
            0% { transform: scale(0.97); box-shadow: 0 0 60px rgba(255,255,255,0.5); } 
            100% { transform: scale(1.03); box-shadow: 0 0 110px rgba(255,255,255,0.95); } 
        }
        @keyframes pulse-singularidade { 
            0% { transform: rotate(0deg) scale(1); box-shadow: 0 0 70px rgba(255,255,255,0.7); } 
            50% { transform: rotate(180deg) scale(1.05); box-shadow: 0 0 130px rgba(255,255,255,1); } 
            100% { transform: rotate(360deg) scale(1); box-shadow: 0 0 70px rgba(255,255,255,0.7); } 
        }

        .titulo { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--texto-mutado); text-transform: uppercase; letter-spacing: 2px;}
        .nivel-display { font-size: 3.2rem; color: var(--texto-puro); font-weight: 800; letter-spacing: -1px; text-shadow: 0 0 20px rgba(255,255,255,0.2);}
        
        .stat-card { 
            background: rgba(0,0,0,0.4); 
            border: 1px solid var(--borda-sutil); 
            padding: 18px 22px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: border-color 0.3s;
        }
        .stat-card:hover {
            border-color: var(--borda-hover);
        }
        .stat-label { font-size: 0.85rem; color: var(--texto-mutado); text-transform: uppercase; font-weight: 600;}
        .stat-value { font-size: 1.3rem; font-weight: 700; color: var(--texto-puro); }
    </style>
</head>
<body>

    <a href="/" class="btn-voltar">← Voltar ao Dashboard</a>
    <canvas id="canvas-energia"></canvas>

    <div class="main-container">
        <!-- ÁREA CENTRAL DA ESFERA -->
        <div class="area-nucleo">
            <div id="meu-nucleo" class="nucleo nivel-1"></div>
        </div>

        <!-- PAINEL DE ESTATÍSTICAS -->
        <div class="area-stats">
            <div>
                <div class="titulo">Nível Atual</div>
                <div id="txt-nivel" class="nivel-display">Nível 1</div>
            </div>
            
            <div class="stat-card">
                <span class="stat-label">Sequência</span>
                <span id="txt-dias-seguidos" class="stat-value">...</span>
            </div>
            
            <div class="stat-card">
                <span class="stat-label">Pontuação (XP)</span>
                <span id="txt-xp-total" class="stat-value">...</span>
            </div>
        </div>
    </div>

    <script>
    async function carregarDadosReais() {
        try {
            const res = await fetch('/api/dados');
            const data = await res.json();
            
            // 1. Carrega o XP com o nome correto
            const xpTotal = data.xp || 0;
            document.getElementById('txt-xp-total').innerText = xpTotal.toLocaleString('pt-BR');
            
            // 2. Carrega Dias Seguidos
            const diasSeguidos = data.dias_seguidos || 0;
            const textoDias = diasSeguidos === 1 ? 'Dia' : 'Dias';
            document.getElementById('txt-dias-seguidos').innerText = `${diasSeguidos} ${textoDias}`;
            
            // 3. Calcula o nível usando 'xpTotal'
            const nivel = Math.floor(Math.sqrt(xpTotal / 50)) + 1;
            document.getElementById('txt-nivel').innerText = `Nível ${nivel}`;
            
            // 4. Atualiza a classe da esfera de energia
            const nucleo = document.getElementById('meu-nucleo');
            nucleo.className = 'nucleo'; 

            if (nivel < 10) nucleo.classList.add('nivel-1'); 
            else if (nivel < 30) nucleo.classList.add('nivel-2');
            else if (nivel < 60) nucleo.classList.add('nivel-3');
            else if (nivel < 100) nucleo.classList.add('nivel-4');
            else nucleo.classList.add('nivel-5');

        } catch(e) { 
            console.error("Erro ao carregar dados:", e); 
        }
    }

        /* ANIMAÇÃO DE PARTÍCULAS NO CANVAS */
        const canvas = document.getElementById('canvas-energia');
        const ctx = canvas.getContext('2d');
        let width, height, particulas = [];

        function resize() { 
            width = canvas.width = window.innerWidth; 
            height = canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particula {
            constructor() { 
                this.reset();
            }
            reset() {
                this.x = Math.random() * width; 
                this.y = Math.random() * height; 
                this.tamanho = Math.random() * 1.5 + 0.5; 
                this.vx = (Math.random() - 0.5) * 0.4; 
                this.vy = (Math.random() - 0.5) * 0.4; 
                this.opacidade = Math.random() * 0.4 + 0.1;
            }
            update() { 
                this.x += this.vx; 
                this.y += this.vy; 
                if(this.x < 0 || this.x > width) this.vx *= -1; 
                if(this.y < 0 || this.y > height) this.vy *= -1; 
            }
            draw() { 
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacidade})`; 
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI * 2); 
                ctx.fill(); 
            }
        }
        
        for(let i = 0; i < 120; i++) particulas.push(new Particula());

        function animarCanvas() {
            ctx.clearRect(0, 0, width, height);
            particulas.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animarCanvas);
        }
        
        animarCanvas();
        carregarDadosReais();
    </script>

    <script>
        /* SISTEMA DE FOCO (SINCRO EM SEGUNDO PLANO) */
        let relogioIntervalo;
        let tempoTotalDefinido = parseInt(localStorage.getItem('foco_total_segundos')) || 0;
        let tempoFim = parseInt(localStorage.getItem('foco_fim_timestamp')) || 0;
        let estaRodando = localStorage.getItem('foco_rodando') === 'true';

        function atualizarTelaRelogio() {
            if (!estaRodando && tempoTotalDefinido === 0) return;
            let tempoRestante = Math.max(0, Math.floor((tempoFim - Date.now()) / 1000));

            if (estaRodando && tempoRestante <= 0) {
                estaRodando = false;
                clearInterval(relogioIntervalo);
                salvarFocoConcluido();
            }
        }

        async function salvarFocoConcluido() {
            try {
                const res = await fetch('/api/dados');
                let dados = await res.json();

                dados.tempo_total = (dados.tempo_total || 0) + tempoTotalDefinido;
                dados.xp = (dados.xp || 0) + Math.floor(tempoTotalDefinido / 60);
                
                const hoje = new Date().toLocaleDateString('pt-BR');
                if (dados.ultimo_acesso !== hoje) {
                    dados.dias_seguidos = (dados.dias_seguidos || 0) + 1;
                    dados.ultimo_acesso = hoje;
                }

                await fetch('/api/dados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                localStorage.removeItem('foco_total_segundos');
                localStorage.removeItem('foco_fim_timestamp');
                localStorage.removeItem('foco_rodando');
                localStorage.removeItem('foco_disciplina');

                // Recarrega os dados na tela para a esfera crescer na hora
                carregarDadosReais(); 
            } catch (e) {
                console.error("Erro ao salvar progresso de foco:", e);
            }
        }

        if (estaRodando) relogioIntervalo = setInterval(atualizarTelaRelogio, 1000);
    </script>

</body>
</html>
