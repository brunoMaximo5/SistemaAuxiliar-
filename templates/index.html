<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle do Edital</title>
    <style>
        /* Regra universal para a tela ocupar 100% corretamente */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-principal: linear-gradient(135deg, #121212 0%, #000000 100%);
            --bg-painel: rgba(20, 20, 20, 0.6);
            --bg-card: rgba(30, 30, 30, 0.4);
            --borda-sutil: rgba(255, 255, 255, 0.08);
            --borda-hover: rgba(255, 255, 255, 0.2);
            --texto-puro: #ffffff;
            --texto-base: #e0e0e0;
            --texto-mutado: #888888;
            --btn-primario-bg: linear-gradient(135deg, #f5f5f5 0%, #c0c0c0 100%);
            --btn-primario-texto: #000000;
            --btn-secundario-bg: #2a2a2a;
            --btn-secundario-hover: #3a3a3a;
            --btn-excluir: #2b1d1d;
            --btn-excluir-hover: #4a2525;
            --texto-excluir: #d99a9a;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: linear-gradient(135deg, #121212 0%, #000000 100%);
            color: var(--texto-base);
            display: flex;
            overflow: hidden;
            width: 100vw;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--bg-painel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid var(--borda-sutil);
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .status-panel {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--borda-sutil);
            margin-bottom: 20px;
        }

        .xp-label { font-size: 0.85rem; color: var(--texto-mutado); text-transform: uppercase; letter-spacing: 1px; }
        
        .xp-valor { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: var(--texto-puro); 
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .nivel-valor { 
            font-size: 0.9rem; 
            color: var(--texto-base); 
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--texto-mutado);
            padding: 16px 24px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            border-left: 3px solid transparent;
        }

        .nav-btn:hover { background: rgba(255, 255, 255, 0.03); color: var(--texto-puro); }
        .nav-btn.active { 
            border-left-color: var(--texto-puro); 
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            color: var(--texto-puro); 
            font-weight: 600; 
        }

        .main-content {
            flex: 1;
            padding: 50px;
            overflow-y: auto;
            width: 100%;
        }

        .container-interno {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        h1 { 
            margin-top: 0; 
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #777777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        .top-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            background: var(--bg-painel);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--borda-sutil);
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--borda-sutil);
            color: var(--texto-puro);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        input[type="text"]:focus { border-color: var(--borda-hover); background: rgba(0, 0, 0, 0.8); box-shadow: 0 0 10px rgba(255, 255, 255, 0.05); }

        button, .btn-link {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
        }

        .btn-primario { background: var(--btn-primario-bg); color: var(--btn-primario-texto); box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1); }
        .btn-primario:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2); }
        .btn-secundario { background: var(--btn-secundario-bg); color: var(--texto-base); border: 1px solid var(--borda-sutil); }
        .btn-secundario:hover { background: var(--btn-secundario-hover); border-color: var(--borda-hover); }
        .btn-excluir { background: var(--btn-excluir); color: var(--texto-excluir); border: 1px solid rgba(217, 154, 154, 0.1); }
        .btn-excluir:hover { background: var(--btn-excluir-hover); color: #fff; border-color: rgba(255, 100, 100, 0.3); }
        .btn-concluido { background: transparent; color: var(--texto-mutado); border: 1px dashed var(--borda-sutil); cursor: default; }

        .disciplina-card {
            background: var(--bg-card);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--borda-sutil);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            width: 100%;
        }

        .disciplina-card:hover { border-color: var(--borda-hover); }

        .disciplina-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--borda-sutil);
        }

        .disciplina-header h2 { margin: 0; font-size: 1.4rem; font-weight: 500; color: var(--texto-puro); }

        .assunto-item {
            background: rgba(10, 10, 10, 0.4);
            border: 1px solid var(--borda-sutil);
            border-radius: 8px;
            padding: 18px 24px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .assunto-item:hover { background: rgba(20, 20, 20, 0.8); transform: translateX(5px); border-color: var(--borda-hover); }
        .assunto-title { font-weight: 400; font-size: 1.05rem; }
        .assunto-actions { display: flex; gap: 12px; align-items: center; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="status-panel">
            <div class="xp-label">Pontuação Total</div>
            <div id="xp-display" class="xp-valor">0</div>
            <div id="nivel-display" class="nivel-valor">Nível 1</div>
        </div>
        
        <!-- MÓDULO DE FOCO DECRESCENTE NA SIDEBAR -->
        <div style="padding: 20px; border-bottom: 1px solid var(--borda-sutil); background: rgba(0,0,0,0.3);">
            <div style="font-size: 0.75rem; color: var(--texto-mutado); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: center;">Modo Foco</div>
            
            <select id="select-disciplina" style="width: 100%; padding: 8px; margin-bottom: 10px; background: rgba(0,0,0,0.5); color: var(--texto-puro); border: 1px solid var(--borda-sutil); border-radius: 4px; outline: none;">
                <option value="">Selecione a Disciplina...</option>
            </select>

            <div style="display: flex; gap: 5px; margin-bottom: 15px; justify-content: center; align-items: center;">
                <input type="number" id="input-minutos" placeholder="Min" value="50" style="width: 60px; padding: 5px; text-align: center; background: rgba(0,0,0,0.5); color: var(--texto-puro); border: 1px solid var(--borda-sutil); border-radius: 4px;">
                <span style="color: var(--texto-mutado); font-size: 0.8rem;">minutos</span>
            </div>

            <div id="relogio-global" style="font-size: 2.2rem; font-weight: 800; color: var(--texto-puro); font-family: monospace; text-align: center; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,255,255,0.1);">
                00:00:00
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button id="btn-relogio" onclick="alternarRelogio()" style="flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; background: var(--texto-puro); color: #000; transition: 0.3s;">
                    ▶ Iniciar
                </button>
                <button onclick="cancelarFoco()" style="padding: 10px; border-radius: 6px; border: 1px solid var(--borda-sutil); font-weight: bold; cursor: pointer; background: transparent; color: #ff4444; transition: 0.3s;">
                    ⏹ Cancelar
                </button>
            </div>
        </div>
        <!-- FIM DO MÓDULO DE FOCO -->

        <!-- LINKS DE NAVEGAÇÃO -->
        <a href="/" class="nav-btn active">Tela Inicial</a>
        <a href="/nucleo" class="nav-btn">Meu Núcleo</a>
        <a href="/estatistica" class="nav-btn">Estatística</a>
        <a href="/forum" class="nav-btn">Fórum</a>
    </aside>

    <main class="main-content">
        <div class="container-interno">
            <h1>Controle Estratégico</h1>
            
            <!-- NOVO DASHBOARD DA TELA INICIAL -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;">
                <!-- CARD DE OFENSIVA -->
                <div style="background: var(--bg-card); border: 1px solid var(--borda-sutil); border-radius: 12px; padding: 30px; text-align: center;">
                    <div style="color: var(--texto-mutado); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 10px;">Sequência de Estudos</div>
                    <div id="dash-streak" style="font-size: 3.5rem; font-weight: 800; color: #ff9800;">🔥 0</div>
                    <div style="color: var(--texto-mutado); font-size: 0.85rem; margin-top: 10px;">Dias seguidos</div>
                </div>

                <!-- CARD HORAS TOTAIS -->
                <div style="background: var(--bg-card); border: 1px solid var(--borda-sutil); border-radius: 12px; padding: 30px; text-align: center;">
                    <div style="color: var(--texto-mutado); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 10px;">Tempo Total</div>
                    <div id="dash-horas" style="font-size: 3.5rem; font-weight: 800; color: var(--texto-puro);">0h</div>
                    <div style="color: var(--texto-mutado); font-size: 0.85rem; margin-top: 10px;">Foco acumulado</div>
                </div>
            </div>
            
            <!-- CONTROLE DE DISCIPLINAS -->
            <div class="top-bar">
                <input type="text" id="input-disciplina" placeholder="Nome da Nova Disciplina (Ex: Direito Constitucional)">
                <button class="btn-primario" onclick="adicionarDisciplina()">Adicionar Disciplina</button>
            </div>
            
            <div id="lista-disciplinas"></div>
        </div>
    </main>

    <!-- LÓGICA DE DADOS, DISCIPLINAS E DASHBOARD -->
    <script>
        let dadosApp = { xp: 0, tempo_total: 0, edital: [] };

        window.onload = async () => {
            await carregarDoBanco();
            renderizarTela();
        };

        async function carregarDoBanco() {
            try {
                const res = await fetch('/api/dados');
                dadosApp = await res.json();
            } catch (erro) { console.error("Erro ao carregar dados:", erro); }
        }

        async function salvarNoBanco() {
            try {
                await fetch('/api/dados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosApp)
                });
                renderizarTela(); 
            } catch (erro) { console.error("Erro ao salvar dados:", erro); }
        }

        function renderizarTela() {
            atualizarStatus();

            const container = document.getElementById('lista-disciplinas');
            container.innerHTML = ''; 

            if (!dadosApp.edital) return; // Segurança caso o banco esteja vazio

            dadosApp.edital.forEach((disciplina, i_disc) => {
                let htmlTopicos = '';
                
                if(disciplina.topicos) {
                    disciplina.topicos.forEach((topico, i_top) => {
                        const idAssunto = `${i_disc}-${i_top}`;
                        let btnEstudarHtml = topico.estudou 
                            ? `<button class="btn-concluido">Concluído</button>` 
                            : `<button class="btn-primario" onclick="marcarComoEstudado(${i_disc}, ${i_top})">Marcar Estudado</button>`;

                        htmlTopicos += `
                            <div class="assunto-item">
                                <span class="assunto-title" style="${topico.estudou ? 'color: var(--texto-mutado); text-decoration: line-through;' : ''}">
                                    ${topico.nome}
                                </span>
                                <div class="assunto-actions">
                                    ${btnEstudarHtml}
                                    <a href="/sala/${idAssunto}" class="btn-secundario">Acessar Sala</a>
                                    <button class="btn-excluir" onclick="removerTopico(${i_disc}, ${i_top})">Excluir</button>
                                </div>
                            </div>
                        `;
                    });
                }

                container.insertAdjacentHTML('beforeend', `
                    <div class="disciplina-card">
                        <div class="disciplina-header">
                            <h2>${disciplina.nome}</h2>
                            <button class="btn-excluir" onclick="removerDisciplina(${i_disc})">Remover Disciplina</button>
                        </div>
                        <div class="top-bar" style="margin-bottom: 15px; border: none; padding: 0; background: transparent;">
                            <input type="text" id="input_assunto_${i_disc}" placeholder="Adicionar novo assunto à disciplina...">
                            <button class="btn-secundario" onclick="adicionarTopico(${i_disc})">Adicionar Assunto</button>
                        </div>
                        <div>${htmlTopicos}</div>
                    </div>
                `);
            });
        }

        function atualizarStatus() {
            // Atualiza XP e Nível na Sidebar
            const xp = dadosApp.xp || 0;
            document.getElementById('xp-display').innerText = xp;
            const nivel = Math.floor(Math.sqrt(xp / 50)) + 1; 
            document.getElementById('nivel-display').innerText = `Nível ${nivel}`;

            // Atualiza Dashboard Principal
            document.getElementById('dash-streak').innerHTML = `🔥 ${dadosApp.dias_seguidos || 0}`;
            const horas = ((dadosApp.tempo_total || 0) / 3600).toFixed(1);
            document.getElementById('dash-horas').innerText = `${horas}h`;
        }

        function adicionarDisciplina() {
            const input = document.getElementById('input-disciplina');
            const nome = input.value.trim();
            if (!nome) return;
            
            if (!dadosApp.edital) dadosApp.edital = [];
            dadosApp.edital.push({ nome: nome, tempo_estudado: 0, topicos: [] });
            input.value = '';
            salvarNoBanco();
        }

        function removerDisciplina(index) {
            if (confirm('Tem certeza que deseja apagar esta disciplina inteira? O tempo estudado também será perdido.')) {
                dadosApp.edital.splice(index, 1);
                salvarNoBanco();
            }
        }

        function adicionarTopico(i_disc) {
            const input = document.getElementById(`input_assunto_${i_disc}`);
            const nome = input.value.trim();
            if (!nome) return;
            
            if (!dadosApp.edital[i_disc].topicos) dadosApp.edital[i_disc].topicos = [];
            dadosApp.edital[i_disc].topicos.push({ nome: nome, estudou: false, data_conclusao: null, questoes: 0, resumo: "" });
            input.value = '';
            salvarNoBanco();
        }

        function removerTopico(i_disc, i_top) {
            if (confirm('Remover este assunto?')) {
                dadosApp.edital[i_disc].topicos.splice(i_top, 1);
                salvarNoBanco();
            }
        }

        function marcarComoEstudado(i_disc, i_top) {
            const topico = dadosApp.edital[i_disc].topicos[i_top];
            if (!topico.estudou) {
                topico.estudou = true;
                topico.data_conclusao = new Date().toISOString().split('T')[0];
                dadosApp.xp = (dadosApp.xp || 0) + 10;
                salvarNoBanco();
            }
        }
    </script>

    <!-- SISTEMA DO RELÓGIO POMODORO GLOBAL (SIDEBAR) -->
    <script>
        let relogioIntervalo;
        let tempoTotalDefinido = parseInt(localStorage.getItem('foco_total_segundos')) || 0;
        let tempoFim = parseInt(localStorage.getItem('foco_fim_timestamp')) || 0;
        let estaRodando = localStorage.getItem('foco_rodando') === 'true';
        let idDisciplinaAtual = localStorage.getItem('foco_disciplina') || "";

        const displayRelogio = document.getElementById('relogio-global');
        const btnRelogio = document.getElementById('btn-relogio');
        const selectDisciplina = document.getElementById('select-disciplina');
        const inputMinutos = document.getElementById('input-minutos');

        async function carregarDisciplinasSelect() {
            if (!selectDisciplina) return; 
            try {
                const res = await fetch('/api/dados');
                const appData = await res.json();
                const edital = appData.edital || [];
                
                selectDisciplina.innerHTML = '<option value="">Selecione a Disciplina...</option>';
                edital.forEach((disc, index) => {
                    const option = document.createElement('option');
                    // Salvar o index da disciplina para poder adicionar o tempo nela especificamente no futuro
                    option.value = index; 
                    option.innerText = disc.nome;
                    selectDisciplina.appendChild(option);
                });
                if (idDisciplinaAtual) selectDisciplina.value = idDisciplinaAtual;
            } catch (e) { console.error(e); }
        }

        function formatarTempo(seg) {
            if (seg <= 0) return "00:00:00";
            const h = String(Math.floor(seg / 3600)).padStart(2, '0');
            const m = String(Math.floor((seg % 3600) / 60)).padStart(2, '0');
            const s = String(seg % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function atualizarTelaRelogio() {
            if (!estaRodando && tempoTotalDefinido === 0) {
                if (displayRelogio) displayRelogio.innerText = "00:00:00";
                return;
            }

            let tempoRestante = Math.max(0, Math.floor((tempoFim - Date.now()) / 1000));
            
            if (displayRelogio && btnRelogio && selectDisciplina && inputMinutos) {
                displayRelogio.innerText = formatarTempo(tempoRestante);
                
                if (estaRodando) {
                    btnRelogio.innerText = "Em Foco...";
                    btnRelogio.disabled = true;
                    btnRelogio.style.opacity = "0.5";
                    selectDisciplina.disabled = true;
                    inputMinutos.disabled = true;
                } else {
                    btnRelogio.innerText = "▶ Iniciar";
                    btnRelogio.disabled = false;
                    btnRelogio.style.opacity = "1";
                    selectDisciplina.disabled = false;
                    inputMinutos.disabled = false;
                }
            }

            // Quando o tempo zera!
            if (estaRodando && tempoRestante <= 0) {
                estaRodando = false;
                clearInterval(relogioIntervalo);
                salvarFocoConcluido();
            }
        }

        function alternarRelogio() {
            if (selectDisciplina && !selectDisciplina.value) {
                alert("Selecione uma disciplina primeiro!");
                return;
            }
            let minutos = parseInt(inputMinutos.value);
            if (isNaN(minutos) || minutos <= 0) {
                alert("Digite um tempo válido em minutos.");
                return;
            }

            tempoTotalDefinido = minutos * 60;
            tempoFim = Date.now() + (tempoTotalDefinido * 1000);
            
            localStorage.setItem('foco_total_segundos', tempoTotalDefinido);
            localStorage.setItem('foco_fim_timestamp', tempoFim);
            localStorage.setItem('foco_rodando', 'true');
            if (selectDisciplina) localStorage.setItem('foco_disciplina', selectDisciplina.value);
            
            estaRodando = true;
            relogioIntervalo = setInterval(atualizarTelaRelogio, 1000);
            atualizarTelaRelogio();
        }

        function cancelarFoco() {
            if (!estaRodando) return;
            if(confirm("Deseja realmente cancelar este foco? O tempo não será salvo.")) {
                limparFocoLocal();
            }
        }

        function limparFocoLocal() {
            estaRodando = false;
            clearInterval(relogioIntervalo);
            localStorage.removeItem('foco_total_segundos');
            localStorage.removeItem('foco_fim_timestamp');
            localStorage.removeItem('foco_rodando');
            localStorage.removeItem('foco_disciplina');
            tempoTotalDefinido = 0;
            if(btnRelogio) {
                btnRelogio.innerText = "▶ Iniciar";
                btnRelogio.disabled = false;
                btnRelogio.style.opacity = "1";
            }
            if(selectDisciplina) selectDisciplina.disabled = false;
            if(inputMinutos) inputMinutos.disabled = false;
            atualizarTelaRelogio();
        }

        async function salvarFocoConcluido() {
            alert("🎯 Parabéns! Bloco de foco concluído. Salvando dados...");
            
            try {
                const res = await fetch('/api/dados');
                let dados = await res.json();

                // Soma o tempo e XP Global
                dados.tempo_total = (dados.tempo_total || 0) + tempoTotalDefinido;
                dados.xp = (dados.xp || 0) + Math.floor(tempoTotalDefinido / 60);

                // Adiciona o tempo estudado na disciplina específica
                const indexDisciplina = localStorage.getItem('foco_disciplina');
                if (indexDisciplina !== null && dados.edital[indexDisciplina]) {
                    dados.edital[indexDisciplina].tempo_estudado = (dados.edital[indexDisciplina].tempo_estudado || 0) + tempoTotalDefinido;
                }
                
                // Lógica de Ofensiva (Dias Seguidos)
                const hoje = new Date().toLocaleDateString('pt-BR');
                if (dados.ultimo_acesso !== hoje) {
                    dados.dias_seguidos = (dados.dias_seguidos || 0) + 1;
                    dados.ultimo_acesso = hoje;
                }

                await fetch('/api/dados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                limparFocoLocal();
                window.location.reload(); // Recarrega para atualizar a tela inicial
            } catch (e) {
                console.error("Erro ao salvar:", e);
                alert("Erro ao salvar o progresso.");
            }
        }

        // INICIALIZAÇÃO DO RELÓGIO
        carregarDisciplinasSelect();
        if (estaRodando) relogioIntervalo = setInterval(atualizarTelaRelogio, 1000);
        atualizarTelaRelogio();
    </script>
