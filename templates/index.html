{% extends "base.html" %}

{% block titulo %}Controle Estratégico{% endblock %}

{% block estilos %}
<style>
    /* Estilos específicos do Controle de Edital e Abas */
    .tabs-wrapper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--borda-sutil);
        margin-bottom: 25px;
        padding-bottom: 10px;
    }

    .tabs-container {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        scrollbar-width: none; 
    }
    .tabs-container::-webkit-scrollbar { display: none; } 

    .tab-btn {
        background: transparent;
        border: 1px solid transparent;
        color: var(--texto-mutado);
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        white-space: nowrap;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--texto-base); }
    .tab-btn.active {
        background: var(--bg-card);
        border-color: var(--borda-sutil);
        color: var(--texto-puro);
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    .tab-add-btn {
        background: transparent;
        border: 1px dashed rgba(255,255,255,0.3);
        color: var(--texto-mutado);
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
    }
    .tab-add-btn:hover { border-color: var(--texto-puro); color: var(--texto-puro); }
    
    .btn-apagar-secao {
        background: transparent;
        color: var(--texto-excluir);
        border: none;
        cursor: pointer;
        font-size: 0.85rem;
        padding: 10px;
        transition: 0.3s;
        opacity: 0.7;
    }
    .btn-apagar-secao:hover { opacity: 1; text-decoration: underline; }

    .top-bar {
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
        background: var(--bg-painel);
        padding: 15px;
        border-radius: 8px;
        border: 1px solid var(--borda-sutil);
        width: 100%;
    }

    input[type="text"] {
        flex: 1;
        padding: 14px 20px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--borda-sutil);
        color: var(--texto-puro);
        font-size: 1rem;
        outline: none;
        transition: all 0.3s ease;
    }
    
    input[type="text"]:focus { 
        border-color: var(--borda-hover); 
        background: rgba(0, 0, 0, 0.8); 
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.05); 
    }

    button, .btn-link {
        padding: 12px 20px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.5px;
    }

    .btn-primario { background: var(--btn-primario-bg); color: var(--btn-primario-texto); box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1); }
    .btn-primario:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2); }
    .btn-secundario { background: var(--btn-secundario-bg); color: var(--texto-base); border: 1px solid var(--borda-sutil); }
    .btn-secundario:hover { background: var(--btn-secundario-hover); border-color: var(--borda-hover); }
    .btn-excluir { background: var(--btn-excluir); color: var(--texto-excluir); border: 1px solid rgba(217, 154, 154, 0.1); }
    .btn-excluir:hover { background: var(--btn-excluir-hover); color: #fff; border-color: rgba(255, 100, 100, 0.3); }
    .btn-concluido { background: transparent; color: var(--texto-mutado); border: 1px dashed var(--borda-sutil); cursor: default; }

    .disciplina-card {
        background: var(--bg-card);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 30px;
        border: 1px solid var(--borda-sutil);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        transition: transform 0.3s ease;
        width: 100%;
    }

    .disciplina-card:hover { border-color: var(--borda-hover); }

    .disciplina-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--borda-sutil);
    }

    .disciplina-header h2 { margin: 0; font-size: 1.4rem; font-weight: 500; color: var(--texto-puro); }

    .select-mover {
        background: rgba(0,0,0,0.5);
        color: var(--texto-mutado);
        border: 1px solid var(--borda-sutil);
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 0.8rem;
        outline: none;
        cursor: pointer;
        transition: 0.3s;
    }
    .select-mover:hover {
        color: var(--texto-puro);
        border-color: var(--borda-hover);
    }

    .assunto-item {
        background: rgba(10, 10, 10, 0.4);
        border: 1px solid var(--borda-sutil);
        border-radius: 8px;
        padding: 18px 24px;
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s ease;
    }

    .assunto-item:hover { background: rgba(20, 20, 20, 0.8); transform: translateX(5px); border-color: var(--borda-hover); }
    .assunto-title { font-weight: 400; font-size: 1.05rem; }
    .assunto-actions { display: flex; gap: 12px; align-items: center; }
</style>
{% endblock %}

{% block conteudo %}
<h1>Controle Estratégico</h1>

<!-- DASHBOARD DA TELA INICIAL -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;">
    <div style="background: var(--bg-card); border: 1px solid var(--borda-sutil); border-radius: 12px; padding: 30px; text-align: center;">
        <div style="color: var(--texto-mutado); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 10px;">Sequência de Estudos</div>
        <div id="dash-streak" style="font-size: 3.5rem; font-weight: 800; color: #ff9800;">🔥 0</div>
        <div style="color: var(--texto-mutado); font-size: 0.85rem; margin-top: 10px;">Dias seguidos</div>
    </div>

    <div style="background: var(--bg-card); border: 1px solid var(--borda-sutil); border-radius: 12px; padding: 30px; text-align: center;">
        <div style="color: var(--texto-mutado); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 10px;">Tempo Total</div>
        <div id="dash-horas" style="font-size: 3.5rem; font-weight: 800; color: var(--texto-puro);">0h</div>
        <div style="color: var(--texto-mutado); font-size: 0.85rem; margin-top: 10px;">Foco acumulado</div>
    </div>
</div>

<!-- CONTROLE DE SEÇÕES (ABAS) -->
<div class="tabs-wrapper">
    <div class="tabs-container" id="container-abas">
        <!-- Abas renderizadas via JS -->
    </div>
    <button class="btn-apagar-secao" onclick="apagarCategoriaAtual()">🗑 Apagar Seção Atual</button>
</div>

<!-- CONTROLE DE DISCIPLINAS -->
<div class="top-bar">
    <input type="text" id="input-disciplina" placeholder="Nome da Nova Disciplina (Adicionada na seção atual)">
    <button class="btn-primario" onclick="adicionarDisciplina()">Adicionar Disciplina</button>
</div>

<div id="lista-disciplinas"></div>
{% endblock %}

{% block scripts %}
<script>
    let dadosApp = { xp: 0, tempo_total: 0, edital: [], categorias: ['Principal'] };
    let abaAtiva = localStorage.getItem('aba_ativa') || 'Principal';

    window.onload = async () => {
        await carregarDoBanco();
        renderizarTela();
    };

    async function carregarDoBanco() {
        try {
            const res = await fetch('/api/dados');
            const tempDados = await res.json();
            if (tempDados) dadosApp = Object.assign(dadosApp, tempDados);
            
            if (!dadosApp.categorias || dadosApp.categorias.length === 0) {
                dadosApp.categorias = ['Principal'];
            }
            if (dadosApp.edital) {
                dadosApp.edital.forEach(d => {
                    if (!d.categoria) d.categoria = 'Principal';
                });
            }
            if (!dadosApp.categorias.includes(abaAtiva)) {
                abaAtiva = dadosApp.categorias[0];
            }
        } catch (erro) { console.error("Erro ao carregar dados:", erro); }
    }

    async function salvarNoBanco() {
        try {
            await fetch('/api/dados', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosApp)
            });
            renderizarTela(); 
            if (typeof carregarDisciplinasSelect === 'function') {
                carregarDisciplinasSelect();
            }
        } catch (erro) { console.error("Erro ao salvar dados:", erro); }
    }

    /* ABAS DE CATEGORIA */
    function renderizarAbas() {
        const container = document.getElementById('container-abas');
        container.innerHTML = '';
        
        dadosApp.categorias.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${cat === abaAtiva ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => mudarAba(cat);
            container.appendChild(btn);
        });

        const btnAdd = document.createElement('button');
        btnAdd.className = 'tab-add-btn';
        btnAdd.innerText = '+ Nova Seção';
        btnAdd.onclick = adicionarCategoria;
        container.appendChild(btnAdd);
    }

    function mudarAba(nome) {
        abaAtiva = nome;
        localStorage.setItem('aba_ativa', abaAtiva);
        renderizarTela();
    }

    function adicionarCategoria() {
        const nome = prompt("Digite o nome da nova seção (Ex: PMPE, Faculdade, Concurso XPTO):");
        if (nome && nome.trim() !== "") {
            const nomeFormatado = nome.trim();
            if (!dadosApp.categorias.includes(nomeFormatado)) {
                dadosApp.categorias.push(nomeFormatado);
                mudarAba(nomeFormatado);
                salvarNoBanco();
            } else {
                alert("Esta seção já existe!");
            }
        }
    }

    function apagarCategoriaAtual() {
        if(dadosApp.categorias.length <= 1) {
            alert("Você não pode apagar a única seção existente.");
            return;
        }
        const temDisciplinas = dadosApp.edital.some(d => d.categoria === abaAtiva);
        
        let mensagem = `Tem certeza que deseja apagar a seção "${abaAtiva}"?`;
        if (temDisciplinas) {
            mensagem = `CUIDADO! Existem disciplinas salvas em "${abaAtiva}".\nSe você apagar esta seção, todas as disciplinas dela serão APAGADAS DEFINITIVAMENTE.\n(Dica: Você pode mover as disciplinas para outra seção antes de apagar).\n\nDeseja continuar mesmo assim?`;
        }

        if(confirm(mensagem)) {
            dadosApp.edital = dadosApp.edital.filter(d => d.categoria !== abaAtiva);
            dadosApp.categorias = dadosApp.categorias.filter(c => c !== abaAtiva);
            mudarAba(dadosApp.categorias[0]);
            salvarNoBanco();
        }
    }

    function moverDisciplina(indexDisciplina, novaCategoria) {
        if (dadosApp.edital[indexDisciplina].categoria !== novaCategoria) {
            dadosApp.edital[indexDisciplina].categoria = novaCategoria;
            salvarNoBanco();
        }
    }

    /* RENDERIZAÇÃO DA TELA */
    function renderizarTela() {
        atualizarStatus();
        renderizarAbas();

        const container = document.getElementById('lista-disciplinas');
        container.innerHTML = ''; 

        if (!dadosApp.edital) return;

        dadosApp.edital.forEach((disciplina, i_disc) => {
            if (disciplina.categoria !== abaAtiva) return;

            let optionsMover = '';
            dadosApp.categorias.forEach(cat => {
                let selected = (cat === disciplina.categoria) ? 'selected' : '';
                optionsMover += `<option value="${cat}" ${selected}>Mover para: ${cat}</option>`;
            });

            let htmlTopicos = '';
            if(disciplina.topicos) {
                disciplina.topicos.forEach((topico, i_top) => {
                    const idAssunto = `${i_disc}-${i_top}`;
                    let btnEstudarHtml = topico.estudou 
                        ? `<button class="btn-concluido">Concluído</button>` 
                        : `<button class="btn-primario" onclick="marcarComoEstudado(${i_disc}, ${i_top})">Marcar Estudado</button>`;

                    htmlTopicos += `
                        <div class="assunto-item">
                            <span class="assunto-title" style="${topico.estudou ? 'color: var(--texto-mutado); text-decoration: line-through;' : ''}">
                                ${topico.nome}
                            </span>
                            <div class="assunto-actions">
                                ${btnEstudarHtml}
                                <a href="/sala/${idAssunto}" class="btn-secundario">Acessar Sala</a>
                                <button class="btn-excluir" onclick="removerTopico(${i_disc}, ${i_top})">Excluir</button>
                            </div>
                        </div>
                    `;
                });
            }

            container.insertAdjacentHTML('beforeend', `
                <div class="disciplina-card">
                    <div class="disciplina-header">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <h2>${disciplina.nome}</h2>
                            <select class="select-mover" onchange="moverDisciplina(${i_disc}, this.value)">
                                ${optionsMover}
                            </select>
                        </div>
                        <button class="btn-excluir" onclick="removerDisciplina(${i_disc})">Remover Disciplina</button>
                    </div>
                    <div class="top-bar" style="margin-bottom: 15px; border: none; padding: 0; background: transparent;">
                        <input type="text" id="input_assunto_${i_disc}" placeholder="Adicionar novo assunto à disciplina...">
                        <button class="btn-secundario" onclick="adicionarTopico(${i_disc})">Adicionar Assunto</button>
                    </div>
                    <div>${htmlTopicos}</div>
                </div>
            `);
        });
    }

    function atualizarStatus() {
        const xp = dadosApp.xp || 0;
        const elemXp = document.getElementById('xp-display');
        const elemNivel = document.getElementById('nivel-display');
        
        if (elemXp) elemXp.innerText = xp;
        if (elemNivel) {
            const nivel = Math.floor(Math.sqrt(xp / 50)) + 1; 
            elemNivel.innerText = `Nível ${nivel}`;
        }

        document.getElementById('dash-streak').innerHTML = `🔥 ${dadosApp.dias_seguidos || 0}`;
        const horas = ((dadosApp.tempo_total || 0) / 3600).toFixed(1);
        document.getElementById('dash-horas').innerText = `${horas}h`;
    }

    /* AÇÕES DE DISCIPLINAS E TÓPICOS */
    function adicionarDisciplina() {
        const input = document.getElementById('input-disciplina');
        const nome = input.value.trim();
        if (!nome) return;
        
        if (!dadosApp.edital) dadosApp.edital = [];
        dadosApp.edital.push({ nome: nome, categoria: abaAtiva, tempo_estudado: 0, topicos: [] });
        input.value = '';
        salvarNoBanco();
    }

    function removerDisciplina(index) {
        if (confirm('Tem certeza que deseja apagar esta disciplina inteira? O tempo estudado também será perdido.')) {
            dadosApp.edital.splice(index, 1);
            salvarNoBanco();
        }
    }

    function adicionarTopico(i_disc) {
        const input = document.getElementById(`input_assunto_${i_disc}`);
        const nome = input.value.trim();
        if (!nome) return;
        
        if (!dadosApp.edital[i_disc].topicos) dadosApp.edital[i_disc].topicos = [];
        dadosApp.edital[i_disc].topicos.push({ nome: nome, estudou: false, data_conclusao: null, questoes: 0, resumo: "" });
        input.value = '';
        salvarNoBanco();
    }

    function removerTopico(i_disc, i_top) {
        if (confirm('Remover este assunto?')) {
            dadosApp.edital[i_disc].topicos.splice(i_top, 1);
            salvarNoBanco();
        }
    }

    function marcarComoEstudado(i_disc, i_top) {
        const topico = dadosApp.edital[i_disc].topicos[i_top];
        if (!topico.estudou) {
            topico.estudou = true;
            topico.data_conclusao = new Date().toISOString().split('T')[0];
            dadosApp.xp = (dadosApp.xp || 0) + 10;
            salvarNoBanco();
        }
    }
</script>
{% endblock %}
