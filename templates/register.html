<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Meu Sistema</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #eee; background: radial-gradient(circle at top, #242424, #090909 62%); font-family: "Segoe UI", sans-serif; }
        main { width: min(100%, 420px); padding: 34px; border: 1px solid #353535; border-radius: 14px; background: rgba(25, 25, 25, .94); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
        h1 { margin: 0 0 8px; font-size: 1.8rem; } p { color: #aaa; margin: 0 0 26px; }
        label { display: block; margin: 16px 0 7px; color: #ccc; font-size: .9rem; }
        input { width: 100%; padding: 12px 13px; border: 1px solid #444; border-radius: 7px; background: #101010; color: #fff; font: inherit; }
        input:focus { outline: 2px solid #888; outline-offset: 1px; }
        button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 7px; background: #eee; color: #111; font: inherit; font-weight: 700; cursor: pointer; }
        .erro { padding: 10px 12px; border: 1px solid #713d3d; border-radius: 7px; background: #321b1b; color: #f0b7b7; }
        .link { display: block; margin-top: 20px; text-align: center; color: #bbb; font-size: .9rem; }
    </style>
</head>
<body>
    <main>
        <h1>Criar conta</h1>
        <p>Seus estudos e dados ficam separados por usuário.</p>
        {% with mensagens = get_flashed_messages(category_filter=['erro']) %}
            {% for mensagem in mensagens %}<div class="erro">{{ mensagem }}</div>{% endfor %}
        {% endwith %}
        <form method="post">
            <label for="username">Usuário</label>
            <input id="username" name="username" minlength="3" maxlength="30" autocomplete="username" required autofocus>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
            <label for="password_confirm">Confirmar senha</label>
            <input id="password_confirm" name="password_confirm" type="password" minlength="8" autocomplete="new-password" required>
            <button type="submit">Criar conta</button>
        </form>
        <a class="link" href="{{ url_for('login') }}">Já tenho uma conta</a>
    </main>
</body>
</html>
