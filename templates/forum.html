{% extends "base.html" %}

{% block titulo %}Repositório & Fórum{% endblock %}

{% block estilos %}
<style>
    /* Estilos específicos da tela de Fórum/Repositório */
    .caixa-postagem {
        background: var(--bg-card);
        border: 1px solid var(--borda-sutil);
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    textarea {
        width: 100%;
        height: 110px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--borda-sutil);
        color: var(--texto-puro);
        padding: 15px;
        border-radius: 8px;
        resize: vertical;
        outline: none;
        font-family: inherit;
        margin-bottom: 15px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
    }
    textarea:focus { border-color: var(--borda-hover); }

    .controles-postagem {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    .input-arquivo-custom {
        color: var(--texto-base);
        font-size: 0.9rem;
    }
    .input-arquivo-custom::file-selector-button {
        background: var(--btn-secundario-bg);
        color: var(--texto-puro);
        border: 1px solid var(--borda-sutil);
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 10px;
        transition: 0.3s;
    }
    .input-arquivo-custom::file-selector-button:hover { 
        background: #3a3a3a; 
        border-color: var(--borda-hover); 
    }

    .btn-publicar {
        background: var(--btn-primario-bg);
        color: var(--btn-primario-texto);
        padding: 10px 24px;
        border-radius: 6px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-publicar:hover:not(:disabled) { 
        transform: translateY(-2px); 
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1); 
    }
    .btn-publicar:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .post-card {
        background: var(--bg-card);
        border: 1px solid var(--borda-sutil);
        border-radius: 8px;
        padding: 25px;
        margin-bottom: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        transition: border-color 0.3s;
    }
    .post-card:hover {
        border-color: var(--borda-hover);
    }
    
    .post-header { 
        display: flex; 
        justify-content: space-between; 
        margin-bottom: 15px; 
        color: var(--texto-mutado); 
        font-size: 0.85rem; 
        border-bottom: 1px solid var(--borda-sutil); 
        padding-bottom: 10px;
    }
    
    .post-autor { font-weight: bold; color: var(--texto-puro); }
    .post-conteudo { line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--texto-base); }
    
    .anexo-box {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.05);
        padding: 10px 15px;
        border-radius: 6px;
        border: 1px dashed var(--borda-sutil);
        color: #82b1ff;
        text-decoration: none;
        font-size: 0.9rem;
        transition: 0.3s;
        margin-top: 15px;
    }
    .anexo-box:hover { 
        background: rgba(255, 255, 255, 0.1); 
        border-color: #82b1ff; 
    }
</style>
{% endblock %}

{% block conteudo %}
<div style="max-width: 900px; margin: 0 auto; width: 100%;">
    <h1 style="margin-bottom: 25px;">Repositório de Estudos</h1>
    
    <!-- CAIXA DE CRIAÇÃO DE POST -->
    <div class="caixa-postagem">
        <textarea id="texto-post" placeholder="Faça uma anotação, salve uma questão ou descreva o arquivo anexado..."></textarea>
        
        <div class="controles-postagem">
            <input type="file" id="arquivo-post" class="input-arquivo-custom" accept=".pdf, image/png, image/jpeg, .doc, .docx">
            <button id="btn-publicar" class="btn-publicar" onclick="enviarPost()">Salvar no Repositório</button>
        </div>
    </div>

    <!-- FEED DO REPOSITÓRIO -->
    <div id="feed-forum"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let dadosApp = {};

    document.addEventListener('DOMContentLoaded', async () => {
        await carregarDadosBanco();
    });

    async function carregarDadosBanco() {
        try {
            const res = await fetch('/api/dados');
            dadosApp = await res.json();
            renderizarPosts();
        } catch (erro) {
            console.error("Erro ao carregar dados do fórum:", erro);
        }
    }

    async function enviarPost() {
        const textoInput = document.getElementById('texto-post');
        const arquivoInput = document.getElementById('arquivo-post');
        const btn = document.getElementById('btn-publicar');

        const texto = textoInput.value.trim();
        
        if (!texto && arquivoInput.files.length === 0) {
            alert("Digite uma descrição ou escolha um arquivo para salvar!");
            return;
        }

        btn.innerText = "Salvando...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append('texto', texto);
        formData.append('data', new Date().toLocaleDateString('pt-BR'));
        
        if (arquivoInput.files.length > 0) {
            formData.append('arquivo', arquivoInput.files[0]);
        }

        try {
            const res = await fetch('/api/forum', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) throw new Error("Falha na requisição");

            textoInput.value = '';
            arquivoInput.value = '';
            
            await carregarDadosBanco();

        } catch (erro) {
            alert("Erro ao enviar para o repositório.");
            console.error(erro);
        } finally {
            btn.innerText = "Salvar no Repositório";
            btn.disabled = false;
        }
    }

    function escapeHtml(texto) {
        if (!texto) return '';
        const div = document.createElement('div');
        div.innerText = texto;
        return div.innerHTML;
    }

    function renderizarPosts() {
        const feed = document.getElementById('feed-forum');
        feed.innerHTML = '';

        const forum = dadosApp.forum || [];

        if (forum.length === 0) {
            feed.innerHTML = `
                <div class="post-card" style="text-align: center; color: var(--texto-mutado); padding: 40px;">
                    Seu repositório está vazio. Salve seus primeiros PDFs e anotações no formulário acima!
                </div>
            `;
            return;
        }

        // Renderiza os posts do mais recente para o mais antigo
        const postsInvertidos = [...forum].reverse();

        postsInvertidos.forEach(post => {
            let htmlAnexo = '';
            
            if (post.arquivo) {
                htmlAnexo = `
                    <div>
                        <a href="/uploads/${encodeURIComponent(post.arquivo)}" target="_blank" class="anexo-box">
                            📎 ${escapeHtml(post.arquivo)}
                        </a>
                    </div>
                `;
            }

            const textoFormatado = escapeHtml(post.texto) || '<em>Sem descrição.</em>';

            feed.insertAdjacentHTML('beforeend', `
                <div class="post-card">
                    <div class="post-header">
                        <span class="post-autor">Eu</span>
                        <span>${escapeHtml(post.data)}</span>
                    </div>
                    <div class="post-conteudo">${textoFormatado}</div>
                    ${htmlAnexo}
                </div>
            `);
        });
    }
</script>
{% endblock %}
