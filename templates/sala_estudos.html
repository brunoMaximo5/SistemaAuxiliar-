<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Estudos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-principal: #0a0a0a;
            --bg-painel: #141414;
            --bg-card: #1e1e1e;
            --borda-sutil: #333333;
            --borda-hover: #555555;
            --texto-puro: #ffffff;
            --texto-base: #cccccc;
            --texto-mutado: #888888;
            --btn-primario-bg: linear-gradient(135deg, #f5f5f5 0%, #c0c0c0 100%);
            --btn-primario-texto: #000000;
            --btn-secundario-bg: #2a2a2a;
            --btn-secundario-hover: #3a3a3a;
            --cor-acerto: #4caf50;
            --cor-erro: #f44336;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-principal);
            color: var(--texto-base);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =========================================
           TOP BAR
           ========================================= */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--bg-painel);
            border-bottom: 1px solid var(--borda-sutil);
            z-index: 10;
        }

        .titulo-assunto {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--texto-puro);
        }

        /* =========================================
           BOTÕES
           ========================================= */
        button, .btn-link {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primario { background: var(--btn-primario-bg); color: var(--btn-primario-texto); }
        .btn-primario:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(255,255,255,0.15); }
        .btn-secundario { background: var(--btn-secundario-bg); color: var(--texto-puro); border: 1px solid var(--borda-sutil); }
        .btn-secundario:hover { background: var(--btn-secundario-hover); border-color: var(--borda-hover); }

        /* =========================================
           LAYOUT PRINCIPAL (2 COLUNAS)
           ========================================= */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* LADO ESQUERDO: EDITOR DARK */
        .area-editor {
            flex: 2;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--borda-sutil);
            background: var(--bg-principal);
        }

        .toolbar-custom {
            padding: 10px;
            background: var(--bg-painel);
            border-bottom: 1px solid var(--borda-sutil);
            display: flex;
            gap: 5px;
        }

        .toolbar-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--texto-base);
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .toolbar-btn:hover { background: rgba(255,255,255,0.1); }

        #editor-resumo {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            outline: none;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--texto-base);
        }

        /* LADO DIREITO: QUIZ E PEGADINHAS */
        .area-ferramentas {
            flex: 1;
            min-width: 350px;
            background: var(--bg-painel);
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .secao-titulo {
            font-size: 1.1rem;
            color: var(--texto-puro);
            margin-bottom: 15px;
            font-weight: 500;
            border-bottom: 1px solid var(--borda-sutil);
            padding-bottom: 10px;
        }

        textarea.input-dark {
            width: 100%;
            height: 150px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--borda-sutil);
            color: var(--texto-puro);
            padding: 15px;
            border-radius: 6px;
            resize: vertical;
            font-family: inherit;
            outline: none;
        }
        textarea.input-dark:focus { border-color: var(--borda-hover); }

        .card-ferramenta {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--borda-sutil);
            text-align: center;
        }

        .ferramenta-status { font-size: 2rem; font-weight: bold; color: var(--texto-puro); margin: 10px 0; }

        /* =========================================
           MODAIS (SOBREPOSIÇÃO)
           ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }

        .modal-box {
            background: var(--bg-painel);
            border: 1px solid var(--borda-sutil);
            border-radius: 12px;
            padding: 30px;
            width: 600px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .modal-box h2 { margin-top: 0; color: var(--texto-puro); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--texto-mutado); font-size: 0.9rem; }
        
        input[type="text"].input-dark {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--borda-sutil);
            color: var(--texto-puro); border-radius: 6px; outline: none;
        }

        /* Itens do Quiz rodando */
        .questao-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--borda-sutil);
            border-radius: 8px; padding: 20px; margin-bottom: 20px; text-align: left;
        }
        .questao-box h3 { font-size: 1.05rem; margin-top: 0; margin-bottom: 15px; color: var(--texto-puro); }
        .alternativa-label {
            display: block; padding: 10px 15px; background: var(--bg-secundario-bg);
            border: 1px solid var(--borda-sutil); border-radius: 6px; margin-bottom: 8px;
            cursor: pointer; transition: 0.2s;
        }
        .alternativa-label:hover { background: var(--bg-secundario-hover); border-color: var(--borda-hover); }
        
        .alt-correta { background: rgba(76, 175, 80, 0.2) !important; border-color: var(--cor-acerto) !important; color: var(--cor-acerto); }
        .alt-errada { background: rgba(244, 67, 54, 0.2) !important; border-color: var(--cor-erro) !important; color: var(--cor-erro); }
        
        .botoes-modal { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* Estilos do Cartão de Flashcard (Revisão) */
        .flashcard-viewer {
            background: var(--bg-card); min-height: 250px; padding: 30px; 
            border-radius: 12px; border: 1px solid var(--borda-sutil); 
            display: flex; flex-direction: column; justify-content: center; 
            margin-bottom: 20px; text-align: center;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="/" class="btn-secundario">← Voltar</a>
        <div class="titulo-assunto" id="nome-assunto">Carregando Assunto...</div>
        <button class="btn-primario" onclick="salvarTudo()">Salvar Progresso</button>
    </header>

    <div class="workspace">
        <!-- LADO ESQUERDO: Resumo -->
        <main class="area-editor">
            <div class="toolbar-custom">
                <button class="toolbar-btn" onclick="formatar('bold')">B</button>
                <button class="toolbar-btn" onclick="formatar('italic')">I</button>
                <button class="toolbar-btn" onclick="formatar('underline')">U</button>
                <button class="toolbar-btn" onclick="formatar('insertUnorderedList')">• Lista</button>
            </div>
            <div id="editor-resumo" contenteditable="true" placeholder="Digite seu resumo aqui..."></div>
        </main>

        <!-- LADO DIREITO: Ferramentas -->
        <aside class="area-ferramentas">
            <div>
                <h3 class="secao-titulo">Pegadinhas & Erros Recorrentes</h3>
                <textarea id="texto-erros" class="input-dark" placeholder="Anote aqui as cascas de banana da banca..."></textarea>
            </div>

            <!-- CARD DE FLASHCARDS (NOVO) -->
            <div class="card-ferramenta">
                <h3 class="secao-titulo" style="border:none; margin-bottom: 0;">Flashcards</h3>
                <div class="ferramenta-status" id="qtd-flashcards">0</div>
                <div style="color: var(--texto-mutado); margin-bottom: 20px; font-size: 0.9rem;">Cartões Cadastrados</div>
                
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn-secundario" onclick="abrirModalAddFlashcard()">+ Adicionar Cartão</button>
                    <button class="btn-primario" onclick="abrirModalRevisaoFlashcard()">Estudar Flashcards</button>
                </div>
            </div>

            <!-- CARD DE QUIZ -->
            <div class="card-ferramenta">
                <h3 class="secao-titulo" style="border:none; margin-bottom: 0;">Quiz Interativo</h3>
                <div class="ferramenta-status" id="qtd-questoes">0</div>
                <div style="color: var(--texto-mutado); margin-bottom: 20px; font-size: 0.9rem;">Questões Cadastradas</div>
                
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn-secundario" onclick="abrirModalNovaQuestao()">+ Adicionar Questão</button>
                    <button class="btn-primario" onclick="abrirModalQuiz()">Iniciar Revisão (Quiz)</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- MODAIS DO QUIZ -->
    <!-- Modal Add Questão -->
    <div id="modal-add-questao" class="modal-overlay">
        <div class="modal-box">
            <h2>Nova Questão</h2>
            <div class="form-group">
                <label>Enunciado da Questão</label>
                <textarea id="novo-enunciado" class="input-dark" style="height: 80px;"></textarea>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <label style="color: var(--texto-mutado); font-size: 0.9rem; margin: 0;">Preencha as alternativas e marque a correta:</label>
                <div style="display: flex; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid var(--borda-sutil); border-radius: 6px; padding: 2px;">
                    <button class="toolbar-btn" style="padding: 2px 10px;" onclick="mudarQtdAlternativas(-1)">-</button>
                    <span id="contador-alt" style="color: var(--texto-puro); font-weight: bold; width: 20px; text-align: center;">4</span>
                    <button class="toolbar-btn" style="padding: 2px 10px;" onclick="mudarQtdAlternativas(1)">+</button>
                </div>
            </div>
            <div id="container-alternativas"></div>
            <div class="botoes-modal">
                <button class="btn-secundario" onclick="fecharModal('modal-add-questao')">Cancelar</button>
                <button class="btn-primario" onclick="salvarNovaQuestao()">Salvar Questão</button>
            </div>
        </div>
    </div>

    <!-- Modal Resolver Quiz -->
    <div id="modal-quiz" class="modal-overlay">
        <div class="modal-box" style="width: 800px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borda-sutil); padding-bottom: 15px; margin-bottom: 20px;">
                <h2 style="margin: 0;">Revisão: Quiz</h2>
                <h2 id="resultado-final" style="margin: 0; color: var(--cor-acerto); display: none;">Acertos: 0/0</h2>
            </div>
            <div id="lista-quiz"></div>
            <div class="botoes-modal">
                <button class="btn-secundario" onclick="fecharModal('modal-quiz')">Sair</button>
                <button id="btn-corrigir" class="btn-primario" onclick="corrigirQuiz()">Finalizar e Corrigir</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         NOVOS MODAIS: FLASHCARDS 
         ========================================== -->
    
    <!-- Modal Add Flashcard -->
    <div id="modal-add-flashcard" class="modal-overlay">
        <div class="modal-box">
            <h2>Novo Flashcard</h2>
            <div class="form-group">
                <label>Frente do Cartão (Conceito ou Pergunta)</label>
                <textarea id="novo-flash-frente" class="input-dark" style="height: 80px;" placeholder="Ex: O que é o Princípio da Legalidade?"></textarea>
            </div>
            <div class="form-group">
                <label>Verso do Cartão (Resposta)</label>
                <textarea id="novo-flash-verso" class="input-dark" style="height: 100px;" placeholder="Ex: A Administração Pública só pode fazer o que a lei permite..."></textarea>
            </div>
            <div class="botoes-modal">
                <button class="btn-secundario" onclick="fecharModal('modal-add-flashcard')">Cancelar</button>
                <button class="btn-primario" onclick="salvarNovoFlashcard()">Salvar Cartão</button>
            </div>
        </div>
    </div>

    <!-- Modal Estudar Flashcards -->
    <div id="modal-revisao-flashcard" class="modal-overlay">
        <div class="modal-box" style="width: 600px; text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borda-sutil); padding-bottom: 15px; margin-bottom: 20px;">
                <h2 style="margin: 0;">Treino de Flashcards</h2>
                <span id="flashcard-contador" style="color: var(--texto-mutado);">0/0</span>
            </div>
            
            <div class="flashcard-viewer">
                <h3 id="flashcard-frente-texto" style="font-size: 1.3rem; margin-bottom: 20px; color: var(--texto-puro);">Pergunta...</h3>
                <div id="flashcard-verso-texto" style="font-size: 1.1rem; color: var(--cor-acerto); display: none; padding-top: 20px; border-top: 1px dashed var(--borda-sutil);">
                    Resposta...
                </div>
            </div>

            <div class="botoes-modal" style="justify-content: center; gap: 15px;">
                <button class="btn-secundario" onclick="navegarFlashcard(-1)" id="btn-flash-ant">← Anterior</button>
                <button class="btn-primario" onclick="virarFlashcardAtual()" id="btn-flash-virar">Mostrar Resposta</button>
                <button class="btn-secundario" onclick="navegarFlashcard(1)" id="btn-flash-prox">Próximo →</button>
            </div>
            <div style="margin-top: 15px; text-align: right;">
                 <button class="btn-secundario" onclick="fecharModal('modal-revisao-flashcard')" style="font-size: 0.8rem;">Sair da Revisão</button>
            </div>
        </div>
    </div>

    <script>
        let dadosApp = {};
        let i_disc = 0;
        let i_top = 0;
        let topicoAtual = null;

        // 1. CARREGAMENTO INICIAL
        window.onload = async () => {
            const path = window.location.pathname.split('/');
            const ids = path[path.length - 1].split('-');
            if (ids.length === 2) {
                i_disc = parseInt(ids[0]);
                i_top = parseInt(ids[1]);
            }

            try {
                const res = await fetch('/api/dados');
                dadosApp = await res.json();
                
                topicoAtual = dadosApp.edital[i_disc].topicos[i_top];
                
                // Garantir existência das chaves
                if(!topicoAtual.erros) topicoAtual.erros = "";
                if(!topicoAtual.quiz) topicoAtual.quiz = [];
                if(!topicoAtual.flashcards) topicoAtual.flashcards = []; // <-- NOVO

                renderizarDados();
            } catch (erro) {
                console.error("Erro ao carregar dados:", erro);
                alert("Erro ao carregar os dados do banco.");
            }
        };

        // 2. RENDERIZAÇÃO
        function renderizarDados() {
            document.getElementById('nome-assunto').innerText = topicoAtual.nome;
            document.getElementById('editor-resumo').innerHTML = topicoAtual.resumo || "";
            document.getElementById('texto-erros').value = topicoAtual.erros || "";
            document.getElementById('qtd-questoes').innerText = topicoAtual.quiz.length;
            document.getElementById('qtd-flashcards').innerText = topicoAtual.flashcards.length; // <-- NOVO
        }

        // Editor
        function formatar(comando) {
            document.execCommand(comando, false, null);
            document.getElementById('editor-resumo').focus();
        }

        // 3. SALVAR TUDO
        async function salvarTudo() {
            topicoAtual.resumo = document.getElementById('editor-resumo').innerHTML;
            topicoAtual.erros = document.getElementById('texto-erros').value;
            
            try {
                await fetch('/api/dados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosApp)
                });
                alert("Progresso salvo com sucesso!");
            } catch (erro) {
                alert("Erro ao salvar.");
            }
        }

        function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

        // ==========================================
        // 4. LÓGICA DE FLASHCARDS (NOVO)
        // ==========================================
        let indexFlashcardAtual = 0;

        function abrirModalAddFlashcard() {
            document.getElementById('novo-flash-frente').value = "";
            document.getElementById('novo-flash-verso').value = "";
            document.getElementById('modal-add-flashcard').style.display = 'flex';
        }

        function salvarNovoFlashcard() {
            const frente = document.getElementById('novo-flash-frente').value.trim();
            const verso = document.getElementById('novo-flash-verso').value.trim();

            if (!frente || !verso) {
                alert("Preencha a Frente e o Verso do cartão!");
                return;
            }

            topicoAtual.flashcards.push({ pergunta: frente, resposta: verso });
            document.getElementById('qtd-flashcards').innerText = topicoAtual.flashcards.length;
            
            fecharModal('modal-add-flashcard');
            salvarTudo();
        }

        function abrirModalRevisaoFlashcard() {
            if (topicoAtual.flashcards.length === 0) {
                alert("Cadastre alguns flashcards primeiro!");
                return;
            }
            indexFlashcardAtual = 0;
            atualizarUIFlashcard();
            document.getElementById('modal-revisao-flashcard').style.display = 'flex';
        }

        function atualizarUIFlashcard() {
            const card = topicoAtual.flashcards[indexFlashcardAtual];
            
            // Textos
            document.getElementById('flashcard-frente-texto').innerText = card.pergunta;
            document.getElementById('flashcard-verso-texto').innerText = card.resposta;
            
            // Esconde resposta ao trocar de card
            document.getElementById('flashcard-verso-texto').style.display = 'none';
            document.getElementById('btn-flash-virar').style.display = 'inline-flex';
            
            // Status do contador
            document.getElementById('flashcard-contador').innerText = `${indexFlashcardAtual + 1} / ${topicoAtual.flashcards.length}`;
            
            // Controles de botão
            document.getElementById('btn-flash-ant').disabled = (indexFlashcardAtual === 0);
            document.getElementById('btn-flash-prox').disabled = (indexFlashcardAtual === topicoAtual.flashcards.length - 1);
        }

        function virarFlashcardAtual() {
            document.getElementById('flashcard-verso-texto').style.display = 'block';
            document.getElementById('btn-flash-virar').style.display = 'none';
        }

        function navegarFlashcard(direcao) {
            const novoIndice = indexFlashcardAtual + direcao;
            if (novoIndice >= 0 && novoIndice < topicoAtual.flashcards.length) {
                indexFlashcardAtual = novoIndice;
                atualizarUIFlashcard();
            }
        }

        // ==========================================
        // 5. LÓGICA DO QUIZ (MANTIDO DO ORIGINAL)
        // ==========================================
        let qtdAlternativasAtuais = 4;

        function renderizarInputsAlternativas() {
            const container = document.getElementById('container-alternativas');
            if (!container) return; 
            container.innerHTML = "";
            for (let i = 0; i < qtdAlternativasAtuais; i++) {
                const checked = (i === 0) ? "checked" : "";
                const letra = String.fromCharCode(65 + i);
                container.insertAdjacentHTML('beforeend', `
                    <div class="form-group" style="display: flex; gap: 10px; align-items: center;">
                        <input type="radio" name="correta" value="${i}" ${checked}>
                        <input type="text" id="alt-${i}" class="input-dark" placeholder="Alternativa ${letra}">
                    </div>
                `);
            }
            const contadorEl = document.getElementById('contador-alt');
            if (contadorEl) contadorEl.innerText = qtdAlternativasAtuais;
        }

        function mudarQtdAlternativas(delta) {
            const novaQtd = qtdAlternativasAtuais + delta;
            if (novaQtd >= 2 && novaQtd <= 6) { 
                qtdAlternativasAtuais = novaQtd;
                renderizarInputsAlternativas();
            }
        }

        function abrirModalNovaQuestao() {
            document.getElementById('novo-enunciado').value = "";
            qtdAlternativasAtuais = 4; 
            renderizarInputsAlternativas();
            document.getElementById('modal-add-questao').style.display = 'flex';
        }

        function salvarNovaQuestao() {
            const enunciado = document.getElementById('novo-enunciado').value.trim();
            const alternativas = [];
            for (let i = 0; i < qtdAlternativasAtuais; i++) {
                const inputEl = document.getElementById(`alt-${i}`);
                if (!inputEl) continue;
                const valorInput = inputEl.value.trim();
                if (valorInput === "") { alert("Preencha todas as alternativas visíveis!"); return; }
                alternativas.push(valorInput);
            }
            const radioSelecionado = document.querySelector('input[name="correta"]:checked');
            if (!radioSelecionado) { alert("Selecione qual é a resposta correta marcando a bolinha!"); return; }
            const correta = parseInt(radioSelecionado.value);
            if (!enunciado) { alert("Preencha o enunciado!"); return; }

            topicoAtual.quiz.push({ enunciado: enunciado, alternativas: alternativas, correta: correta });
            document.getElementById('qtd-questoes').innerText = topicoAtual.quiz.length;
            fecharModal('modal-add-questao');
            salvarTudo(); 
        }

        function abrirModalQuiz() {
            if (topicoAtual.quiz.length === 0) { alert("Cadastre algumas questões primeiro!"); return; }
            document.getElementById('resultado-final').style.display = 'none';
            document.getElementById('btn-corrigir').style.display = 'inline-flex';
            
            const container = document.getElementById('lista-quiz');
            container.innerHTML = "";

            topicoAtual.quiz.forEach((q, indexQuestao) => {
                let htmlAlternativas = "";
                q.alternativas.forEach((alt, indexAlt) => {
                    htmlAlternativas += `
                        <label class="alternativa-label" id="label-${indexQuestao}-${indexAlt}">
                            <input type="radio" name="resposta-${indexQuestao}" value="${indexAlt}">
                            ${alt}
                        </label>
                    `;
                });
                container.insertAdjacentHTML('beforeend', `
                    <div class="questao-box">
                        <h3>${indexQuestao + 1}. ${q.enunciado}</h3>
                        <div class="opcoes-container">${htmlAlternativas}</div>
                    </div>
                `);
            });
            document.getElementById('modal-quiz').style.display = 'flex';
        }

        function corrigirQuiz() {
            let acertos = 0;
            const total = topicoAtual.quiz.length;
            topicoAtual.quiz.forEach((q, indexQuestao) => {
                const selecionada = document.querySelector(`input[name="resposta-${indexQuestao}"]:checked`);
                const valSelecionado = selecionada ? parseInt(selecionada.value) : -1;
                const labelCorreta = document.getElementById(`label-${indexQuestao}-${q.correta}`);
                if (labelCorreta) labelCorreta.classList.add('alt-correta');

                if (valSelecionado === q.correta) { acertos++; } 
                else if (valSelecionado !== -1) {
                    const labelErrada = document.getElementById(`label-${indexQuestao}-${valSelecionado}`);
                    if (labelErrada) labelErrada.classList.add('alt-errada');
                }
                const radios = document.querySelectorAll(`input[name="resposta-${indexQuestao}"]`);
                radios.forEach(r => r.disabled = true);
            });
            const lblResultado = document.getElementById('resultado-final');
            lblResultado.innerText = `Acertos: ${acertos} / ${total}`;
            lblResultado.style.color = acertos === total ? "var(--cor-acerto)" : (acertos === 0 ? "var(--cor-erro)" : "var(--texto-puro)");
            lblResultado.style.display = "block";
            document.getElementById('btn-corrigir').style.display = 'none';
        }
    </script>
</body>
</html>
